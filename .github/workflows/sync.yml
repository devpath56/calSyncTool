name: Calendar Sync

on:
  schedule:
    # Run every 10 minutes between 6am and 6pm (UTC) on weekdays
    # This translates to 13:00-01:00 UTC (6am-6pm PST/PDT)
    - cron: '*/10 13-23 * * 1-5'  # Monday-Friday, 1:00-11:50 PM UTC
    - cron: '*/10 0-1 * * 2-6'    # Tuesday-Saturday, 12:00-1:50 AM UTC (covers 6pm previous day)
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run calendar sync
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      run: |
        python sync.py
    
    - name: Upload sync logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: sync-logs-${{ github.run_number }}
        path: sync.log
        retention-days: 7
